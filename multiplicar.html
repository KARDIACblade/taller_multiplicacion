<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de multiplicar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="multiplicar.css">
  <script src="multiplicar.js" defer></script>

</head>
<body>
  <header>
    <button class="btn-probar"  onclick="generarTablas()">PROBAR</button>
  </header>

  <main>
    <h1>Tabla del <span>3</span></h1>
    
    <div class="tabla" id="contenedorTabla">                      <!-- CONTENEDOR   <div class="tabla"> -->
      <div class="fila">3 x 1 = 3</div>      <!-- ITEM <div class="fila"> se repite varias veces-->
      <div class="fila">3 x 2 = 6</div>
      <div class="fila">3 x 3 = 9</div>
      <div class="fila">3 x 4 = 12</div>
      <div class="fila">3 x 5 = 15</div>
      <div class="fila">3 x 6 = 18</div>
      <div class="fila">3 x 7 = 21</div>
      <div class="fila">3 x 8 = 24</div>
      <div class="fila">3 x 9 = 27</div>
      <div class="fila">3 x 10 = 30</div>
    </div>
  </main>
  <footer>
    Creado por: <strong>BLADE</strong>
  </footer>
</body>
</html>
